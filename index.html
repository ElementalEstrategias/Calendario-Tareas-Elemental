<style>
  :root{
    --ink:#0B0B14;
    --violet:#6D28D9;
    --blue:#4338CA;
    --magenta:#C026D3;
    --paper:#F6F5FA;
    --card:#FFFFFF;
    --line:#E4E2ED;
    --muted:#7A7788;
    --today-bg:#F1EBFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
  }

  /* ---------- HEADER ---------- */
  .topbar{
    background:linear-gradient(120deg, var(--ink) 0%, #1a1330 55%, var(--violet) 100%);
    padding:22px 28px 26px;
    color:#fff;
  }
  .brand{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
  }
  .brand h1{
    margin:0;
    font-size:22px;
    font-weight:800;
    letter-spacing:-0.02em;
  }
  .brand h1 span{
    background:linear-gradient(90deg, #A78BFA, #F0ABFC);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .brand .sub{
    font-size:13px;
    color:#C9C4DA;
    margin-top:2px;
  }
  .weeknav{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .weeknav button{
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.18);
    color:#fff;
    width:32px;height:32px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    line-height:1;
  }
  .weeknav button:hover{background:rgba(255,255,255,0.2);}
  .weeknav .range{
    font-size:14px;
    font-weight:600;
    min-width:170px;
    text-align:center;
  }
  .weeknav .today-btn{
    width:auto;
    padding:0 12px;
    font-size:12px;
    font-weight:600;
  }
  .weeknav .view-toggle{
    background:rgba(255,255,255,0.1);
    border-color:rgba(255,255,255,0.18);
    margin-right:4px;
  }
  .weeknav .view-toggle button{
    width:auto;
    height:auto;
    padding:7px 14px;
    white-space:nowrap;
    border:none;
    font-size:12.5px;
    font-weight:700;
    color:#C9C4DA;
  }
  .weeknav .view-toggle button.active{
    background:#fff;
    color:var(--ink);
  }
  .weeknav button:focus, .weeknav button:focus-visible{
    outline:none;
    box-shadow:0 0 0 2px rgba(167,139,250,0.7);
  }

  /* ---------- BOARD ---------- */
  .board{
    display:grid;
    grid-template-columns:repeat(5, minmax(190px,1fr));
    gap:12px;
    padding:20px;
    overflow-x:auto;
  }
  .day{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    min-height:220px;
    display:flex;
    flex-direction:column;
  }
  .day.today{
    border-color:var(--violet);
    background:var(--today-bg);
  }
  .day-head{
    padding:12px 14px 8px;
    border-bottom:1px solid var(--line);
  }
  .day.today .day-head{border-bottom-color:#DCCBFA;}
  .day-name{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.04em;
    color:var(--muted);
  }
  .day.today .day-name{color:var(--violet);}
  .day-num{
    font-size:20px;
    font-weight:800;
    margin-top:1px;
  }
  .tasks{
    padding:10px 10px 4px;
    display:flex;
    flex-direction:column;
    gap:7px;
    flex:1;
  }
  .task{
    background:var(--paper);
    border-left:3px solid var(--violet);
    border-radius:6px;
    padding:8px 9px;
    font-size:13px;
    line-height:1.35;
    position:relative;
  }
  .task.done{opacity:0.45;}
  .task.done .task-title{text-decoration:line-through;}
  .task-title{
    font-weight:600;
    padding-right:16px;
    word-break:break-word;
  }
  .task-meta{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:5px;
  }
  .avatar{
    width:18px;height:18px;
    border-radius:50%;
    color:#fff;
    font-size:9px;
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .client-tag{
    display:inline-block;
    font-size:9.5px;
    font-weight:800;
    letter-spacing:0.02em;
    color:#fff;
    padding:2px 7px;
    border-radius:20px;
    margin-bottom:5px;
  }
  .assignees-row{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
    margin-top:5px;
  }
  .assignee-chip{
    display:flex;
    align-items:center;
    gap:4px;
  }
  .avatar-stack{
    display:flex;
    align-items:center;
  }
  .avatar-stack .avatar{
    border:2px solid var(--paper);
    margin-left:-6px;
  }
  .avatar-stack .avatar:first-child{margin-left:0;}
  .assignee-name{
    font-size:11px;
    color:var(--muted);
    font-weight:600;
  }
  .task-actions{
    display:flex;
    justify-content:flex-end;
    gap:2px;
    margin-top:6px;
    padding-top:6px;
    border-top:1px solid var(--line);
  }
  .task-actions button{
    border:none;
    background:transparent;
    cursor:pointer;
    color:var(--muted);
    font-size:13px;
    padding:5px 7px;
    line-height:1;
    border-radius:5px;
  }
  .task-actions button:hover{color:var(--ink); background:rgba(0,0,0,0.06);}
  .task-actions button.confirm-armed{
    background:#DC2626 !important;
    color:#fff !important;
    font-size:10px;
    font-weight:700;
    padding:5px 8px;
  }

  .add-row{padding:8px 10px 12px;}
  .add-btn{
    width:100%;
    background:transparent;
    border:1.5px dashed var(--line);
    border-radius:8px;
    padding:7px;
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    cursor:pointer;
  }
  .add-btn:hover{border-color:var(--violet); color:var(--violet);}

  .add-form{
    display:flex;
    flex-direction:column;
    gap:10px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
  }
  .add-form label{
    display:block;
    font-size:11.5px;
    font-weight:800;
    color:var(--muted);
    letter-spacing:0.02em;
    margin-bottom:4px;
  }
  .add-form .field{
    display:flex;
    flex-direction:column;
  }
  .add-form input[type=text]{
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:11px 12px;
    font-size:15px;
    font-family:inherit;
  }
  .client-field-row{
    display:flex;
    gap:8px;
    align-items:stretch;
  }
  .client-field-row .client-input{ flex:1; min-width:0; }
  .add-form input[type=color]{
    width:46px;
    height:auto;
    padding:2px;
    border:1.5px solid var(--line);
    border-radius:8px;
    cursor:pointer;
    background:#fff;
    flex-shrink:0;
  }
  .add-form input[type=text]:focus, .add-form textarea:focus{
    outline:none;
    border-color:var(--violet);
  }
  .add-form textarea{
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:11px 12px;
    font-size:14.5px;
    line-height:1.45;
    font-family:inherit;
    resize:vertical;
    min-height:90px;
  }
  .task-notes{
    margin-top:6px;
    padding-top:6px;
    border-top:1px dashed var(--line);
  }
  .task-notes ul{
    margin:0;
    padding-left:16px;
  }
  .task-notes li{
    font-size:12px;
    color:var(--muted);
    line-height:1.4;
  }
  .task-notes p{
    margin:0;
    font-size:12px;
    color:var(--muted);
    line-height:1.4;
    white-space:pre-wrap;
  }
  .notes-toggle{
    border:none;
    background:transparent;
    color:var(--violet);
    font-size:11px;
    font-weight:700;
    cursor:pointer;
    padding:4px 0 0;
  }
  .add-form .form-row{
    display:flex;
    gap:8px;
    margin-top:2px;
  }
  .add-form .form-row button{
    flex:1;
    border:none;
    border-radius:8px;
    padding:12px;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
  }
  .save-btn{background:var(--violet); color:#fff;}
  .save-btn:hover{background:#5B21B6;}
  .cancel-btn{background:#fff; color:var(--muted); border:1px solid var(--line) !important;}

  .status{
    padding:0 20px 14px;
    font-size:12px;
    color:var(--muted);
  }
  .legend{
    padding:0 20px 18px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .legend .chip{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:11.5px;
    color:var(--muted);
    background:#fff;
    border:1px solid var(--line);
    border-radius:20px;
    padding:3px 9px 3px 5px;
  }

  /* ---------- BACKLOG ---------- */
  .backlog-wrap{
    padding:0 20px 28px;
  }
  .backlog-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .backlog-head h2{
    font-size:15px;
    font-weight:800;
    margin:0;
    letter-spacing:-0.01em;
  }
  .backlog-head .hint{
    font-size:12px;
    color:var(--muted);
  }
  .backlog-list{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:6px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .backlog-empty{
    padding:18px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
  }
  .backlog-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 10px;
    border-radius:9px;
    background:var(--paper);
    border-left:3px solid var(--violet);
  }
  .backlog-item.done{opacity:0.45;}
  .backlog-item.done .task-title{text-decoration:line-through;}
  .backlog-item .task-title{
    flex:1;
    font-size:13px;
    font-weight:600;
    min-width:120px;
  }
  .backlog-item .task-meta{margin-top:0;}
  .backlog-item .move-date{
    border:1px solid var(--line);
    border-radius:6px;
    padding:5px 7px;
    font-size:12px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  .backlog-item .task-actions{
    position:static;
    display:flex;
    gap:4px;
  }
  .backlog-addrow{margin-top:8px;}

  /* ---------- IDENTITY BAR ---------- */
  .identity-bar{
    background:#fff;
    border-bottom:1px solid var(--line);
    padding:12px 20px;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:14px;
  }
  .identity-bar label{
    font-size:12px;
    font-weight:700;
    color:var(--muted);
  }
  .identity-bar select{
    border:1px solid var(--line);
    border-radius:7px;
    padding:6px 9px;
    font-size:13px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  .view-toggle{
    display:flex;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    padding:2px;
  }
  .view-toggle button{
    border:none;
    background:transparent;
    padding:6px 12px;
    font-size:12.5px;
    font-weight:700;
    color:var(--muted);
    border-radius:6px;
    cursor:pointer;
  }
  .view-toggle button.active{
    background:var(--violet);
    color:#fff;
  }
  .identity-note{
    font-size:11.5px;
    color:var(--muted);
  }

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(11,11,20,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
  }
  .modal-overlay.hidden{display:none;}
  .modal-box{
    background:#fff;
    border-radius:16px;
    padding:22px;
    width:100%;
    max-width:560px;
    max-height:88vh;
    overflow-y:auto;
    box-shadow:0 24px 70px rgba(0,0,0,0.35);
  }
  .modal-box h3{
    margin:0 0 14px;
    font-size:17px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .modal-box .add-form{
    background:transparent;
    border:none;
    padding:0;
    gap:14px;
  }
  .modal-box .add-form label{
    font-size:12.5px;
  }
  .modal-box .add-form input[type=text],
  .modal-box .add-form textarea{
    font-size:16px;
    padding:13px 14px;
  }
  .modal-box .add-form textarea{
    min-height:110px;
  }
  .modal-box .add-form .form-row button{
    padding:13px;
    font-size:15px;
  }
  .delete-task-btn{
    width:100%;
    margin-top:10px;
    background:transparent;
    border:1.5px solid #FCA5A5;
    color:#DC2626;
    border-radius:8px;
    padding:11px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
  }
  .delete-task-btn:hover{background:#FEF2F2;}
  .delete-task-btn.confirm-armed{
    background:#DC2626;
    color:#fff;
    border-color:#DC2626;
  }

  /* ---------- MONTH VIEW ---------- */
  .month-weekdays{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    padding:0 20px;
    margin-bottom:6px;
  }
  .month-weekdays div{
    font-size:11px;
    font-weight:700;
    color:var(--muted);
    text-align:center;
    letter-spacing:0.04em;
  }
  .month-board{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    padding:0 20px 20px;
  }
  .month-cell{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    min-height:150px;
    max-height:220px;
    display:flex;
    flex-direction:column;
    padding:10px;
    overflow:hidden;
  }
  .month-cell.other-month{opacity:0.4;}
  .month-cell.today{border-color:var(--violet); background:var(--today-bg);}
  .month-cell .cell-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:4px;
  }
  .month-cell .cell-num{
    font-size:15px;
    font-weight:800;
  }
  .month-cell .cell-add{
    border:none;
    background:transparent;
    color:var(--muted);
    font-size:14px;
    cursor:pointer;
    line-height:1;
    padding:0 2px;
  }
  .month-cell .cell-add:hover{color:var(--violet);}
  .month-tasks{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .month-chip{
    display:flex;
    align-items:center;
    gap:4px;
    font-size:11.5px;
    font-weight:600;
    padding:3px 6px;
    border-radius:5px;
    color:#fff;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .month-chip.done{opacity:0.45; text-decoration:line-through;}

  /* ---------- CLIENT BOARD ---------- */
  .client-board{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
    gap:14px;
    padding:20px;
    align-items:start;
  }
  .client-column{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    display:flex;
    flex-direction:column;
    max-height:74vh;
  }
  .client-head{
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    display:flex;

const TEAM = [

const CLIENTS = []; // vacío a propósito: cada cliente se crea y se le elige color desde el formulario
const PALETTE = ["#6D28D9","#2563EB","#DB2777","#059669","#EA580C","#0891B2","#9333EA","#CA8A04","#DC2626","#16A34A","#C026D3","#4F46E5"];

function colorFor(name){
  let h = 0;
  for(let i=0;i<name.length;i++){ h = name.charCodeAt(i) + ((h<<5)-h); }
  return PALETTE[Math.abs(h) % PALETTE.length];
}

// Color de un cliente: usa el elegido a mano si existe, si no cae al color automático.
function colorForClient(client){
  return clientColors[client] || colorFor(client);
}

function initials(name){

  if(parts.length > 1){
    return parts.slice(0,2).map(w=>w[0]).join("").toUpperCase();

function mondayOf(date){
  const d = new Date(date);
  const day = d.getDay(); // 0 Sun .. 6 Sat
  const diff = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
function isoDate(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtDayName(d){
  return d.toLocaleDateString("es-CO",{weekday:"short"}).replace(".","").toUpperCase();
}
function fmtRange(monday){
  const sunday = new Date(monday); sunday.setDate(sunday.getDate()+6);
  const opts = {day:"numeric", month:"short"};
  return monday.toLocaleDateString("es-CO",opts) + " – " + sunday.toLocaleDateString("es-CO",opts) + ", " + sunday.getFullYear();
}

async function loadTasks(){
  const statusEl = document.getElementById("status");
  if(!TASKS_DOC){
    statusEl.textContent = "⚠️ No se pudo conectar con la base de datos.";
    statusEl.style.color = "#DC2626";
    tasks = [];
    render();
    return;
  }
  function normalize(list){
    list.forEach(t=>{
      if(!t.assignees){ t.assignees = t.assignee ? [t.assignee] : ["Sin asignar"]; }
      if(!t.client){ t.client = "Sin cliente"; }
      if(t.notes === undefined){ t.notes = ""; }
    });
    return list;
  }
  try{
    const snap = await TASKS_DOC.get();
    const data = snap.exists ? snap.data() : null;
    tasks = normalize(data && data.json ? JSON.parse(data.json) : []);
    statusEl.textContent = "Compartido con todo el equipo · se guarda automáticamente";
  }catch(e){
    tasks = [];
    statusEl.textContent = "⚠️ No se pudieron cargar las tareas: " + (e.message || e);
    statusEl.style.color = "#DC2626";
  }
  render();

  // Sincronización en vivo: si alguien más del equipo cambia algo, se actualiza solo, sin recargar.
  TASKS_DOC.onSnapshot(snap=>{
    if(!snap.exists) return;
    const data = snap.data();
    if(!data || !data.json) return;
    const incomingRaw = data.json;
    if(incomingRaw === JSON.stringify(tasks)) return; // ya lo teníamos (fue nuestro propio guardado)
    tasks = normalize(JSON.parse(incomingRaw));
    render();
  });
}

async function saveTasks(){
  const statusEl = document.getElementById("status");
  if(!TASKS_DOC){
    statusEl.textContent = "⚠️ No hay conexión con la base de datos.";
    statusEl.style.color = "#DC2626";
    return false;
  }
  try{
    await TASKS_DOC.set({ json: JSON.stringify(tasks), updatedAt: Date.now() });
    statusEl.textContent = "Guardado ✓ · compartido con todo el equipo";
    statusEl.style.color = "";
    return true;
  }catch(e){
    statusEl.textContent = "⚠️ No se pudo guardar: " + (e.message || e);
    statusEl.style.color = "#DC2626";
    return false;
  }
}

function parseAssignees(raw){
  const names = raw.split(",").map(s=>s.trim()).filter(Boolean);
  return names.length ? names : ["Sin asignar"];
}

async function addTask(dateISO, title, assigneesRaw, client, notes){
  const newTask = {
    id: Date.now() + "-" + Math.random().toString(36).slice(2,7),
    date: dateISO || null,
    title: title.trim(),
    assignees: parseAssignees(assigneesRaw),
    client: (client || "").trim() || "Sin cliente",
    notes: (notes || "").trim(),
    done: false
  };
  tasks.push(newTask);
  render(); // muestra la tarea de inmediato, sin esperar la red
  const ok = await saveTasks();
  if(!ok){
    // si falla el guardado, revertimos para no dar falsa sensación de que quedó
    tasks = tasks.filter(t=>t.id!==newTask.id);
    render();
  } else {
    notifyAssignees(newTask);
  }
}
async function moveTask(id, newDate){
  const t = tasks.find(t=>t.id===id);
  if(!t) return;
  const prevDate = t.date;
  t.date = newDate || null;
  render();
  const ok = await saveTasks();
  if(!ok){ t.date = prevDate; render(); }
}
async function toggleDone(id){
  const t = tasks.find(t=>t.id===id);
  if(!t) return;
  t.done = !t.done;
  render();
  const ok = await saveTasks();
  if(!ok){ t.done = !t.done; render(); }
}
async function deleteTask(id){
  const backup = tasks;
  tasks = tasks.filter(t=>t.id!==id);
  render();
  const ok = await saveTasks();
  if(!ok){ tasks = backup; render(); }
}

async function editTask(id, newTitle, newAssigneesRaw, newClient, newNotes){
  const t = tasks.find(t=>t.id===id);
  if(!t) return;
  const backup = { title:t.title, assignees:t.assignees, client:t.client, notes:t.notes };
  if(!newTitle.trim()) return;
  const previousAssignees = t.assignees;
  t.title = newTitle.trim();
  t.assignees = parseAssignees(newAssigneesRaw);
  t.client = (newClient || "").trim() || "Sin cliente";
  t.notes = (newNotes || "").trim();
  render();
  const ok = await saveTasks();
  if(!ok){
    t.title = backup.title; t.assignees = backup.assignees; t.client = backup.client; t.notes = backup.notes;
    render();
  } else {
    // solo avisamos a quienes se agregaron de nuevo, no a los que ya estaban
    const newlyAdded = t.assignees.filter(n=>!previousAssignees.includes(n));
    if(newlyAdded.length){ notifyAssignees({ ...t, assignees: newlyAdded }); }
  }
}

function notesToHtml(notes){
  if(!notes) return "";
  const lines = notes.split("\n").map(l=>l.trim()).filter(Boolean);
  const isChecklist = lines.some(l=>l.startsWith("-") || l.startsWith("•"));
  if(isChecklist){
    const items = lines.map(l=> l.replace(/^[-•]\s*/, "")).map(l=>`<li>${escapeHtml(l)}</li>`).join("");
    return `<div class="task-notes"><ul>${items}</ul></div>`;
  }
  return `<div class="task-notes"><p>${escapeHtml(notes)}</p></div>`;
}

function buildTaskForm(opts){
  // opts: { title, client, assignees, notes, saveLabel, onSave, onDelete }
  const form = document.createElement("div");
  form.className = "add-form";
  form.innerHTML = `
    <label>Nombre de la tarea</label>
    <input type="text" class="title-input" placeholder="ej. Enviar cotización" value="${escapeHtml(opts.title || "")}">
    <label>Cliente</label>
    <div class="client-field-row">
      <input type="text" class="client-input" list="client-list" placeholder="ej. Proesas" value="${escapeHtml(opts.client || "")}">
      <input type="color" class="client-color-input" title="Color de este cliente">
    </div>
    <label>Asignar a (separa varios con coma)</label>
    <input type="text" class="assignee-input" list="team-list" placeholder="ej. Boris, Natalia" value="${escapeHtml((opts.assignees||[]).join(", "))}">
    <label>Descripción / subtareas (opcional)</label>
    <textarea class="notes-input" placeholder="Una por línea, empieza con - para lista">${escapeHtml(opts.notes || "")}</textarea>
    <div class="form-row">
      <button class="save-btn">${opts.saveLabel || "Guardar"}</button>
      <button class="cancel-btn">Cancelar</button>
    </div>
    ${opts.onDelete ? `<button class="delete-task-btn">🗑 Eliminar esta tarea</button>` : ""}
  `;
  const titleInput = form.querySelector(".title-input");
  const clientInput = form.querySelector(".client-input");
  const colorInput = form.querySelector(".client-color-input");
  const assigneeInput = form.querySelector(".assignee-input");
  const notesInput = form.querySelector(".notes-input");

  function syncColorSwatch(){
    const name = clientInput.value.trim();
    colorInput.value = name ? colorForClient(name) : "#6D28D9";
  }
  syncColorSwatch();
  clientInput.addEventListener("input", syncColorSwatch);

  form.querySelector(".save-btn").onclick = ()=>{
    if(!titleInput.value.trim()){ titleInput.focus(); return; }
    const clientName = clientInput.value.trim();
    if(clientName){ setClientColor(clientName, colorInput.value); }
    closeModal();
    opts.onSave(titleInput.value, assigneeInput.value, clientInput.value, notesInput.value);
  };
  form.querySelector(".cancel-btn").onclick = closeModal;
  if(opts.onDelete){
    const delBtn = form.querySelector(".delete-task-btn");
    armDelete(delBtn, ()=>{ closeModal(); opts.onDelete(); }, "🗑 Eliminar esta tarea");
  }
  setTimeout(()=>{ titleInput.focus(); if(opts.title) titleInput.select(); }, 30);
  return form;
}

  const [y,m,d] = iso.split("-").map(Number);

  return date.toLocaleDateString("es-CO",{day:"numeric", month:"short"});
}

function renderClientBoard(){
  const wrap = document.getElementById("clientBoard");
  const legend = document.getElementById("legend");
  wrap.innerHTML = "";
  document.getElementById("weekRange").textContent = "Por cliente";

  const filtered = tasks.filter(t=> viewMode==="all" || t.assignees.includes(currentUser))
    .filter(t=> clientFilter==="all" || (t.client||"Sin cliente")===clientFilter);
  const clientsInUse = new Set(filtered.map(t=>t.client || "Sin cliente"));
  const allClients = [...clientsInUse].sort((a,b)=>a.localeCompare(b,"es"));

  const usedNames = new Set();

  allClients.forEach(client=>{
    const clientTasks = filtered.filter(t=>(t.client || "Sin cliente")===client).sort((a,b)=>{
      if(a.done !== b.done) return a.done - b.done;
      if(!a.date && !b.date) return 0;
      if(!a.date) return 1;
      if(!b.date) return -1;
      return a.date.localeCompare(b.date);
    });

    const col = document.createElement("div");
    col.className = "client-column";

    const head = document.createElement("div");
    head.className = "client-head";
    head.innerHTML = `
      <div class="client-dot" style="background:${colorForClient(client)}; cursor:pointer;" title="Cambiar color de ${escapeHtml(client)}"></div>
      <div class="name">${escapeHtml(client)}</div>
      <div class="count">${clientTasks.length}</div>
      <button class="cell-add" title="Agregar tarea para este cliente">+</button>
    `;
    head.querySelector(".client-dot").onclick = ()=>pickClientColor(client);
    head.querySelector(".cell-add").onclick = ()=>openAddModal(null, client);
    col.appendChild(head);

    const tasksWrap = document.createElement("div");
    tasksWrap.className = "client-tasks";

    clientTasks.forEach(t=>{
      t.assignees.forEach(n=>usedNames.add(n));
      const el = document.createElement("div");
      el.className = "task" + (t.done ? " done" : "");
      el.style.borderLeftColor = colorForClient(t.client);

      const avatarsHtml = `<div class="avatar-stack">${t.assignees.map(n=>`<div class="avatar" style="background:${colorFor(n)}" title="${escapeHtml(n)}">${initials(n)}</div>`).join("")}</div>`;
      const hasNotes = !!(t.notes && t.notes.trim());
      const notesExpanded = expandedNotes.has(t.id);
      el.innerHTML = `
        <div class="task-date-label">${fmtShortDate(t.date)}</div>
        <div class="task-title">${escapeHtml(t.title)}</div>
        <div class="assignees-row">
          ${avatarsHtml}
          <div class="assignee-name">${t.assignees.map(escapeHtml).join(", ")}</div>
        </div>
        ${hasNotes ? `<button class="notes-toggle" data-act="notes">${notesExpanded ? "▾ Ocultar notas" : "▸ Ver notas/subtareas"}</button>` : ""}
        ${hasNotes && notesExpanded ? notesToHtml(t.notes) : ""}
        <div class="task-actions">
          <button title="Editar" data-act="edit">✎</button>
          <button title="Completar" data-act="done">${t.done ? "↺" : "✓"}</button>
          <button title="Eliminar" data-act="del">✕</button>
        </div>
      `;
      if(hasNotes){ el.querySelector('[data-act="notes"]').onclick = ()=>toggleNotes(t.id); }
      el.querySelector('[data-act="edit"]').onclick = ()=>openEditModal(t);
      el.querySelector('[data-act="done"]').onclick = ()=>toggleDone(t.id);
      armDelete(el.querySelector('[data-act="del"]'), ()=>deleteTask(t.id), "✕");
      tasksWrap.appendChild(el);
    });

    col.appendChild(tasksWrap);
    wrap.appendChild(col);
  });

  renderBacklog();

  legend.innerHTML = "";
  [...usedNames].sort().forEach(name=>{
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.innerHTML = `<div class="avatar" style="background:${colorFor(name)}">${initials(name)}</div>${escapeHtml(name)}`;
    legend.appendChild(chip);
  });
}

function renderMonthBoard(){
  const wrap = document.getElementById("monthBoard");
  const weekdaysWrap = document.getElementById("monthWeekdays");
  const legend = document.getElementById("legend");
  wrap.innerHTML = "";
  weekdaysWrap.innerHTML = "";

  const WD = ["LUN","MAR","MIÉ","JUE","VIE"];
  WD.forEach(w=>{
    const d = document.createElement("div");
    d.textContent = w;
    weekdaysWrap.appendChild(d);
  });

  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const monthNames = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  document.getElementById("weekRange").textContent = monthNames[month].charAt(0).toUpperCase() + monthNames[month].slice(1) + " " + year;

  const firstOfMonth = new Date(year, month, 1);
  const gridStart = mondayOf(firstOfMonth);
  const today = new Date();
  const usedNames = new Set();

  for(let w=0; w<6; w++){
    // si toda esta semana ya cayó en el mes siguiente, no seguimos dibujando filas vacías
    const weekMonday = new Date(gridStart);
    weekMonday.setDate(weekMonday.getDate() + w*7);
    if(w >= 5 && weekMonday.getMonth() !== month) break;

    for(let dow=0; dow<5; dow++){
      const d = new Date(gridStart);
      d.setDate(d.getDate() + w*7 + dow);
      const iso = isoDate(d);
      const isOtherMonth = d.getMonth() !== month;
      const isToday = isoDate(today) === iso;

      const cell = document.createElement("div");
      cell.className = "month-cell" + (isOtherMonth ? " other-month" : "") + (isToday ? " today" : "");

      const top = document.createElement("div");
    top.className = "cell-top";
    top.innerHTML = `<span class="cell-num">${d.getDate()}</span>`;
    const addBtn = document.createElement("button");
    addBtn.className = "cell-add";
    addBtn.textContent = "+";
    addBtn.title = "Agregar tarea este día";
    addBtn.onclick = ()=>openAddModal(iso);
    top.appendChild(addBtn);
    cell.appendChild(top);

    const tasksWrap = document.createElement("div");
    tasksWrap.className = "month-tasks";
    const dayTasks = tasks.filter(t=>t.date===iso)
      .filter(t=> viewMode==="all" || t.assignees.includes(currentUser))
      .filter(t=> clientFilter==="all" || (t.client||"Sin cliente")===clientFilter)
      .sort((a,b)=> (a.done - b.done));
    dayTasks.forEach(t=>{
      t.assignees.forEach(n=>usedNames.add(n));
      const chip = document.createElement("div");
      chip.className = "month-chip" + (t.done ? " done" : "");
      chip.style.background = colorForClient(t.client);
      chip.title = t.title + " · " + t.assignees.join(", ");
      chip.textContent = t.title;
      chip.onclick = ()=>openEditModal(t);
      tasksWrap.appendChild(chip);
    });
    cell.appendChild(tasksWrap);

      wrap.appendChild(cell);
    }
  }

  renderBacklog();

  legend.innerHTML = "";
  [...usedNames].sort().forEach(name=>{
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.innerHTML = `<div class="avatar" style="background:${colorFor(name)}">${initials(name)}</div>${escapeHtml(name)}`;
    legend.appendChild(chip);
  });
}

function renderBacklog(){
  const list = document.getElementById("backlogList");
  list.innerHTML = "";

  const items = tasks.filter(t=>!t.date)
    .filter(t=> viewMode==="all" || t.assignees.includes(currentUser))
    .filter(t=> clientFilter==="all" || (t.client||"Sin cliente")===clientFilter)
    .sort((a,b)=> (a.done - b.done));

  if(items.length === 0){
    const empty = document.createElement("div");
    empty.className = "backlog-empty";
    empty.textContent = viewMode==="mine" ? "No tienes tareas tuyas por programar." : "No hay tareas pendientes por programar.";
    list.appendChild(empty);
  }

  items.forEach(t=>{
    const row = document.createElement("div");
    row.className = "backlog-item" + (t.done ? " done" : "");
    row.style.borderLeftColor = colorForClient(t.client);

    const avatarsHtml = `<div class="avatar-stack">${t.assignees.map(n=>`<div class="avatar" style="background:${colorFor(n)}" title="${escapeHtml(n)}">${initials(n)}</div>`).join("")}</div>`;
    const hasNotes = !!(t.notes && t.notes.trim());
    const notesExpanded = expandedNotes.has(t.id);
    row.innerHTML = `
      <div class="client-tag" style="background:${colorForClient(t.client)}">${escapeHtml(t.client)}</div>
      ${avatarsHtml}
      <div class="task-title">${escapeHtml(t.title)} <span class="assignee-name">(${t.assignees.map(escapeHtml).join(", ")})</span>
        ${hasNotes ? `<button class="notes-toggle" data-act="notes">${notesExpanded ? "▾ Ocultar notas" : "▸ Ver notas/subtareas"}</button>` : ""}
        ${hasNotes && notesExpanded ? notesToHtml(t.notes) : ""}
      </div>
      <input type="date" class="move-date" title="Mover a este día">
      <div class="task-actions">
        <button title="Editar" data-act="edit">✎</button>
        <button title="Completar" data-act="done">${t.done ? "↺" : "✓"}</button>
        <button title="Eliminar" data-act="del">✕</button>
      </div>
    `;
    row.querySelector(".move-date").onchange = (e)=>{
      if(e.target.value) moveTask(t.id, e.target.value);
    };
    if(hasNotes){ row.querySelector('[data-act="notes"]').onclick = ()=>toggleNotes(t.id); }
    row.querySelector('[data-act="edit"]').onclick = ()=>openEditModal(t);
    row.querySelector('[data-act="done"]').onclick = ()=>toggleDone(t.id);
    armDelete(row.querySelector('[data-act="del"]'), ()=>deleteTask(t.id), "✕");
    list.appendChild(row);
  });

  const addRow = document.createElement("div");
  addRow.className = "add-row backlog-addrow";
  const btn = document.createElement("button");
  btn.className = "add-btn";
  btn.textContent = "+ Agregar tarea sin fecha";
  btn.onclick = ()=>openAddModal(null);
  addRow.appendChild(btn);
  list.appendChild(addRow);
}

// Confirmación de dos clics: algunos visores bloquean confirm()/alert() del navegador,
// así que esto reemplaza esa confirmación con un cambio de estado en el propio botón.
function armDelete(btn, onConfirm, originalText){
  let timer = null;
  btn.dataset.armed = "0";
  btn.onclick = ()=>{
    if(btn.dataset.armed === "1"){
      clearTimeout(timer);
      onConfirm();
      return;
    }
    btn.dataset.armed = "1";
    const prevText = btn.textContent;
    btn.textContent = "¿Seguro? Clic de nuevo";
    btn.classList.add("confirm-armed");
    timer = setTimeout(()=>{
      btn.dataset.armed = "0";
      btn.textContent = originalText !== undefined ? originalText : prevText;
      btn.classList.remove("confirm-armed");
    }, 2800);
  };
}

function escapeHtml(s){
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

document.getElementById("prevWeek").onclick = ()=>{
  if(currentView === "week"){ viewDate.setDate(viewDate.getDate() - 7); }
  else { viewDate.setMonth(viewDate.getMonth() - 1); }
  render();
};
document.getElementById("nextWeek").onclick = ()=>{
  if(currentView === "week"){ viewDate.setDate(viewDate.getDate() + 7); }
  else { viewDate.setMonth(viewDate.getMonth() + 1); }
  render();
};
document.getElementById("todayBtn").onclick = ()=>{ viewDate = new Date(); render(); };

function setActiveViewBtn(id){
  ["btnWeekView","btnMonthView","btnClientView"].forEach(bid=>{
    document.getElementById(bid).classList.toggle("active", bid===id);
  });
}
document.getElementById("btnWeekView").onclick = ()=>{
  currentView = "week"; setActiveViewBtn("btnWeekView"); render();
};
document.getElementById("btnMonthView").onclick = ()=>{
  currentView = "month"; setActiveViewBtn("btnMonthView"); render();
};
document.getElementById("btnClientView").onclick = ()=>{
  currentView = "client"; setActiveViewBtn("btnClientView"); render();
};
